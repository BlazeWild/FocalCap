# @package _global_

hydra:
  run:
    dir: ${trainer.default_root_dir}
  sweep:
    dir: ${trainer.default_root_dir}
    subdir: ${hydra.job.override_dirname}
  job_logging:
    version: 1
    formatters:
      simple:
        format: "[%(asctime)s][%(name)s][%(levelname)s] - %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra:runtime.output_dir}/train_net.log
        mode: a
        encoding: utf-8
    root:
      level: INFO
      handlers: [console, file]
    disable_existing_loggers: false

model:
  use_preextracted_features: true
  init_motion_ckpt: "${hydra:runtime.cwd}/checkpoints/phase1_v2/best-014-0.7220.ckpt"
  lr_scratch: 2.0e-4
  lr_lora: 2.0e-4
  # Motion+residual encoder fine-tuning LR = lr_motion_scale * lr_scratch.
  lr_motion_scale: 0.10
  # Diagnostic action-prefix run: keep the phase-1 motion/residual towers fixed
  # so concat-vs-pool effects are not confounded by encoder drift.
  train_motion_encoder: false
  weight_decay: 0.05
  # No warmup for now: peak LR from step 0 so epoch-0 actually trains instead
  # of spending the whole first epoch ramping up (0.05 ≈ 1 full epoch here).
  warmup_ratio: 0.0
  min_lr_ratio: 0.10
  # Optional: unfreeze phase-1 motion/residual students with a lower LR.
  tune_motion_encoder: false
  motion_lr_scale: 0.10
  max_caption_len_train: 50
  max_new_tokens_eval: 60
  # Optional thermal throttle for local machines (seconds of sleep per step).
  # Raised for a cooler training profile on thermally constrained laptops.
  gpu_cooldown_train_step_sec: 0.15
  gpu_cooldown_val_step_sec: 0.15

  cocap_model:
    use_lora: true
    tune_motion_encoder: false
    cls_only: false
    # use_agdtr=false: CLS + Action tokens only, no patch routing. Ablation to
    # test whether action tokens contribute before enabling the full pipeline.
    use_agdtr: false
    # fused_cls: action conditions each GOP CLS, and GPT-2 still sees only 8
    # visual prefix tokens. This avoids the extra-token attention competition
    # seen in interleaved_action1/region4 while keeping the improved action
    # encoder active. Override to interleaved_action1/region4 for ablations.
    action_prefix_mode: "fused_cls"
    block_dropout_p: 0.0
    # Compute caption→visual attention attribution every N train forwards.
    # 0 disables. 200 ≈ once every ~7s; negligible cost, huge diagnostic value.
    attn_probe_every: 200
    # Attention-aux cadence (for optimization signal), target share, and weight.
    attn_aux_every: 50
    attn_aux_target_share: 0.18
    attn_aux_weight: 1.5
    # Start dropout/attn-aux after ~1 epoch (VATEX: ~2298 steps at bs=4,acc=2).
    # Helps avoid early generic-caption collapse.
    regularizer_warmup_steps: 2300
    motion_encoder:
      embed_dim: 384
      num_heads: 8
      num_refiner_layers: 2
      ffn_mult: 4
      dropout: 0.1
      pos_frac: 0.3
      use_residual_encoder: true
      residual_in_channels: 3
      residual_embed_dim: 384
      residual_num_heads: 8
      residual_num_refiner_layers: 2
      residual_ffn_mult: 4
      residual_dropout: 0.1
      residual_pos_frac: 0.3

  loss:
    _target_: cocap.modeling.loss.Phase2CaptionLoss
    label_smoothing: 0.1
    ignore_index: -100

trainer:
  accelerator: "gpu"
  devices: 1
  strategy: "auto"
  max_epochs: 20
  # Effective train batch = train_dataloader.batch_size * accumulate_grad_batches * devices
  # = 4 * 1 * 1 = 4. accumulate=8 gave only ~62 optimizer steps/epoch (499/8),
  # starving the from-scratch projector + LoRA so epoch-0 CIDEr stayed low.
  # accumulate=1 → ~499 updates/epoch (~8x), recovering fast early convergence.
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  # bf16-mixed keeps fp32 master weights + bf16 autocast compute. bf16-true
  # (bf16 weights, bf16 optimizer state, no fp32 master) silently rounds away
  # the small AdamW updates to the from-scratch modality projector + LoRA and
  # starves convergence. Mixed costs ~0.5GB more here and trains far better.
  precision: "bf16-mixed"

  logger:
    - _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
      save_dir: ${trainer.default_root_dir}
      name: "tensorboard"
    - _target_: pytorch_lightning.loggers.csv_logs.CSVLogger
      save_dir: ${trainer.default_root_dir}
      name: "csv_logs"

  callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: "step"
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      save_top_k: 1
      monitor: "val_CIDEr"
      mode: "max"
      dirpath: "${trainer.default_root_dir}/checkpoints/best"
      filename: "best-cider-epoch{epoch:03d}-step{step}"
      auto_insert_metric_name: false
      save_last: true
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      save_top_k: -1
      monitor: null
      every_n_epochs: 1
      dirpath: "${trainer.default_root_dir}/checkpoints/latest"
      filename: "latest-epoch{epoch:03d}-step{step}"
      auto_insert_metric_name: false
      save_on_train_epoch_end: true

train_dataloader:
  dataset:
    split: "train"
  # Low-heat mode: single-process loading to reduce CPU spikes and fan ramps.
  num_workers: 0uuyuuuyuyyhyu
  batch_size: 2
  # Must be null when num_workers=0.
  prefetch_factor: null
  persistent_workers: false
  shuffle: true
  pin_memory: false
  multiprocessing_context: null

val_dataloader:
  dataset:
    split: "val"
  num_workers: 2
  batch_size: 2
  prefetch_factor: null
  persistent_workers: false
  shuffle: false
  pin_memory: false
  multiprocessing_context: null
