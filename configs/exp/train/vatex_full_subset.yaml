# @package _global_
#
# Full-token (CLS + Action + Spatial) run, conservative v3 settings:
#   1. Motion + residual encoders FROZEN. With phase-1 cos-sim 0.3, gradient
#      from caption loss flowing through random act_proj weights into the
#      motion encoder pushed it AWAY from its phase-1 optimum. ActionEncoder
#      remains trainable and acts as the bridge between frozen motion features
#      and the captioning task.
#   2. Per-stream projectors with ZERO-INIT outputs on act_proj / patch_proj.
#      At step 0 the action and patch streams contribute exactly zero, so the
#      prefix is effectively CLS-only — no noise injection. Gradient gradually
#      opens these streams as the model learns to use them.
#   3. LoRA reverted to r=16, alpha=32, [c_attn, c_proj] — matches the proven
#      historical setup. Bigger LoRA only helps if the streams carry signal.
#   4. Action tokens at 2/GOP (16 total) — fewer slots for weak motion features.
#   5. Regularizers (block-dropout, attn-aux) DISABLED. With curriculum-style
#      zero-init streams there is no CLS dominance to suppress yet.
#
# Example (30% subset, WSL2):
#   python tools/train_net.py +exp/train=vatex_full_subset \
#       +train_dataloader.dataset.max_videos_per_split=7500 \
#       +val_dataloader.dataset.max_videos_per_split=900 \
#       trainer.default_root_dir=./logs/vatex_captioning/full_subset_fixes_v4

defaults:
  - /train
  - /dataset@train_dataloader.dataset: vatex
  - /dataset@val_dataloader.dataset: vatex
  - /exp/train/base
  - _self_

trainer:
  default_root_dir: "./logs/vatex_captioning/full_subset_fixes_v10"
  max_epochs: 10

model:
  # Unfreeze motion + residual encoders at low LR. With the Lightning ordering
  # bug fixed (motion init now in setup() before configure_optimizers), this
  # flag actually has effect — gradient updates the motion encoder away from
  # its phase-1 cos-sim 0.3 endpoint toward features useful for captioning.
  # 0.10 = ~1e-5 effective LR, still conservative but adapts faster.
  tune_motion_encoder: true
  motion_lr_scale: 0.10

  cocap_model:
    use_action_tokens: true
    use_spatial_tokens: true
    # 8 action tokens/GOP keeps each GOP's motion slot as its own prefix token,
    # avoiding the pooling collapse that flattened 16 action tokens into a
    # single repeated vector (probe showed within-video spread = 1.34).
    action_tokens_per_gop: 8
    action_use_learned_pooling: true
    # v11 fix: disable residual->motion fusion to reduce token duplication
    # across the 8 exported action slots (probe showed action pairwise cos ~0.999).
    action_fuse_residual_into_motion: false
    # Let router query include CLS context when action tokens are still weak.
    router_use_cls_query: true
    router_duplicate_penalty: 0.75
    router_penalty_decay: 0.95
    # Match the historical baseline so you isolate the architectural delta.
    lora_r: 16
    lora_alpha: 32
    lora_target_modules: ["c_attn", "c_proj"]
    # v11 fix: re-enable anti-collapse regularizers.
    # Your probe shows strong CLS dominance (93%) and almost-zero patch usage (1%).
    block_dropout_p: 0.0
    block_dropout_cls_p: 0.10
    block_dropout_action_p: 0.05
    block_dropout_patch_p: 0.02
    attn_probe_every: 100
    attn_aux_every: 50
    attn_aux_target_share: 0.18
    attn_aux_weight: 1.5
    # Delay regularizers until base caption policy stabilizes.
    regularizer_warmup_steps: 900
