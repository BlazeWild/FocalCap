# Forced to 1 on val/test inside the dataset regardless of this setting.
captions_per_video: 1
max_videos_per_split: 3000
cv_config:
  num_gop: 8
  num_mv: 29
  num_res: 29
  with_residual: true
  with_bp_rgb: false
  use_pre_extract: true
  sample: "pad"
