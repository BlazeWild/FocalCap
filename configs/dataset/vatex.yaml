video_root_pt: "/home/blaze/Documents/Windows_Backup/Ashok/_AI/_COMPUTER_VISION/____RESEARCH/Distilled-Motion-MAE/dataset/vatex/video_preextracted_pt_new"
video_root: "${.video_root_mp4}"
