_target_: __main__.train
model:
  _target_: cocap.modeling.lm_cocap.CoCapLM
  cocap_model:
    _target_: cocap.modules.hav_cocap.HavCoCap
    motion_encoder:
      _target_: cocap.modules.compressed_video.motion_encoder.MotionTransformer
      embed_dim: 384
      decoder_dim: 512
      num_heads: 6
      num_layers: 4
      num_residual_queries: 4
      use_residual_stream: true
      clip_dim: 768
    clip_state_dict: /teamspace/studios/this_studio/Distilled-Motion-MAE/model_zoo/clip_model/ViT-B-16.pt
    semantic_proj_hidden_dim: 512
    use_semantic_projection_head: false
    delta_target_mode: cls
  loss:
    _target_: cocap.modeling.loss.DistillationLoss
    lambda_delta: 1.0
    w_recon: 1.0
    w_cos: 5.0
    w_mse: 0.5
    cos_boost_threshold: 0.85
    cos_boost_factor: 1.0
    semantic_on_normalized: true
    semantic_mse_on_normalized: false
    min_target_norm: 0.0
    norm_eps: 1.0e-08
    center_target: false
    w_infonce: 0.3
    infonce_temperature: 0.1
    w_residual_aux: 8.0
  use_preextracted_features: false
  init_weights_ckpt: ''
  lr: 5.0e-05
  weight_decay: 0.05
  use_lr_scheduler: true
  warmup_ratio: 0.01
  min_lr_ratio: 0.1
  loss_log_every_n_steps: 50
train_dataloader:
  _target_: torch.utils.data.dataloader.DataLoader
  dataset:
    _target_: cocap.data.datasets.compressed_video.dataset_vatex.VATEXCaptioningDataset
    video_root_mp4: ${hydra:runtime.cwd}/dataset/vatex/videos_h264_240p
    video_root_pt: ${hydra:runtime.cwd}/dataset/vatex/video_preextracted_pt
    video_root: ${.video_root_mp4}
    metadata: ${hydra:runtime.cwd}/dataset/vatex/VATEX_caption.json
    use_preextracted_features: ${model.use_preextracted_features}
    max_gops_per_video: 8
    max_videos_per_split: -1
    video_reader: read_frames_compressed_domain
    max_frames: 1
    video_size:
    - 224
    - 224
    max_words: 35
    unfold_sentences: true
    cv_config:
      num_gop: -1
      num_mv: 29
      num_res: 29
      with_residual: true
      with_bp_rgb: false
      use_pre_extract: false
      sample: pad
    split: train
  batch_size: 32
  shuffle: true
  sampler: null
  batch_sampler: null
  num_workers: 16
  collate_fn: null
  pin_memory: true
  drop_last: false
  timeout: 0.0
  worker_init_fn: null
  multiprocessing_context: null
  generator: null
  prefetch_factor: 2
  persistent_workers: false
  pin_memory_device: ''
val_dataloader:
  _target_: torch.utils.data.dataloader.DataLoader
  dataset:
    _target_: cocap.data.datasets.compressed_video.dataset_vatex.VATEXCaptioningDataset
    video_root_mp4: ${hydra:runtime.cwd}/dataset/vatex/videos_h264_240p
    video_root_pt: ${hydra:runtime.cwd}/dataset/vatex/video_preextracted_pt
    video_root: ${.video_root_mp4}
    metadata: ${hydra:runtime.cwd}/dataset/vatex/VATEX_caption.json
    use_preextracted_features: ${model.use_preextracted_features}
    max_gops_per_video: 8
    max_videos_per_split: -1
    video_reader: read_frames_compressed_domain
    max_frames: 1
    video_size:
    - 224
    - 224
    max_words: 35
    unfold_sentences: true
    cv_config:
      num_gop: -1
      num_mv: 29
      num_res: 29
      with_residual: true
      with_bp_rgb: false
      use_pre_extract: false
      sample: pad
    split: val
  batch_size: 32
  shuffle: false
  sampler: null
  batch_sampler: null
  num_workers: 16
  collate_fn: null
  pin_memory: true
  drop_last: false
  timeout: 0.0
  worker_init_fn: null
  multiprocessing_context: null
  generator: null
  prefetch_factor: 2
  persistent_workers: false
  pin_memory_device: ''
trainer:
  _target_: pytorch_lightning.trainer.trainer.Trainer
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${trainer.default_root_dir}
  callbacks:
  - _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 1
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    save_top_k: 1
    monitor: val/L_total_epoch
    mode: min
    dirpath: ${trainer.default_root_dir}/checkpoints/best
    filename: best-epoch{epoch:03d}-step{step}
    auto_insert_metric_name: false
    save_last: false
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    save_top_k: 1
    monitor: null
    mode: min
    every_n_epochs: 1
    filename: latest-epoch{epoch:03d}-step{step}
    auto_insert_metric_name: false
    dirpath: ${trainer.default_root_dir}/checkpoints/latest
    save_on_train_epoch_end: true
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    save_top_k: -1
    every_n_epochs: 10
    filename: epoch{epoch:03d}-step{step}
    auto_insert_metric_name: false
    dirpath: ${trainer.default_root_dir}/checkpoints/periodic
    save_on_train_epoch_end: true
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val/L_total_epoch
    patience: 8
    mode: min
    min_delta: 0.001
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  enable_checkpointing: null
  enable_progress_bar: true
  enable_model_summary: false
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./logs/vatex_pretrain
  model_registry: null
ckpt_path: null
